{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Program · GIKI Applicant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
  <style>
    body {
      background-color: var(--s-900, #070F2B);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .select-program-card {
      background: #ffffff;
      border-radius: var(--radius-lg, 16px);
      max-width: 520px;
      width: 100%;
      padding: 40px 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .logo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo-header img {
      width: 42px;
      height: 42px;
    }
    .logo-title {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: var(--s-900, #070F2B);
      line-height: 1.2;
    }
    .logo-sub {
      font-size: 12px;
      color: var(--s-500, #1d244b);
    }
    .program-card-option {
      border: 2px solid var(--s-200, #D9D9EA);
      border-radius: var(--radius-md, 12px);
      padding: 18px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .program-card-option:hover {
      border-color: var(--s-400, #9290C3);
      background: var(--s-50, #F7F7FC);
    }
    .program-card-option input[type="radio"] {
      width: 20px;
      height: 20px;
      accent-color: var(--s-900, #070F2B);
      cursor: pointer;
    }
    .program-card-option.selected,
    .program-card-option:has(input[type="radio"]:checked) {
      border-color: var(--s-900, #070F2B);
      background: #f0f2fb;
      box-shadow: 0 4px 12px rgba(7, 15, 43, 0.08);
    }
    .program-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--s-900, #070F2B);
      color: #fff;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .program-info-title {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--s-900, #070F2B);
      margin-bottom: 2px;
    }
    .program-info-desc {
      font-size: 13px;
      color: var(--s-500, #555);
      margin: 0;
    }
    .btn-submit-program {
      background: var(--s-900, #070F2B);
      color: #ffffff;
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 24px;
      border-radius: var(--radius-md, 12px);
      width: 100%;
      border: none;
      transition: background 0.2s ease;
      margin-top: 10px;
    }
    .btn-submit-program:hover {
      background: #1B1A55;
    }
  </style>
</head>
<body>
  <div class="select-program-card">
    <div class="logo-header">
      <img src="{% static 'dashboard/images/giki.png' %}" alt="GIKI logo">
      <div>
        <div class="logo-title">GIKI Applicant Portal</div>
        <div class="logo-sub">Ghulam Ishaq Khan Institute</div>
      </div>
    </div>

    <h2 class="h4 fw-bold text-dark mb-1" style="font-family: 'Manrope', sans-serif;">Select Graduate Program</h2>
    <p class="text-muted small mb-4">Please select the degree level you are applying for to set up your application.</p>

    {% if error %}
      <div class="alert alert-danger py-2 px-3 mb-3 small" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{% url 'accounts:select_program' %}">
      {% csrf_token %}
      
      <label class="program-card-option">
        <input type="radio" name="program" value="MS" required>
        <div class="program-badge">MS</div>
        <div>
          <div class="program-info-title">Master of Science (MS)</div>
          <p class="program-info-desc">Postgraduate Master's degree program</p>
        </div>
      </label>

      <label class="program-card-option">
        <input type="radio" name="program" value="PHD" required>
        <div class="program-badge">PhD</div>
        <div>
          <div class="program-info-title">Doctor of Philosophy (PhD)</div>
          <p class="program-info-desc">Doctoral research degree program</p>
        </div>
      </label>

      <button type="submit" class="btn-submit-program">Continue to Portal &rarr;</button>
    </form>
  </div>
</body>
</html>
