<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · GIKI Applicant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  {% load static socialaccount %}
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .login-brand .logo-mark {
      color: #fff;
    }

    .login-brand span {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--s-900);
    }

    .login-card h1 {
      font-size: 19px;
      margin: 0 0 4px;
      color: var(--s-900);
    }

    .login-card p.sub {
      font-size: 13px;
      color: var(--s-500);
      margin: 0 0 22px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--s-700);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--s-300);
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--s-900);
    }

    .field input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .login-error {
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12.5px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
    }

    .login-card .btn {
      width: 100%;
      justify-content: center;
      margin-top: 6px;
    }

    .auth-switch {
      margin: 18px 0 0;
      text-align: center;
      font-size: 13px;
      color: var(--s-500);
    }

    .auth-switch a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="card login-card">
    <div class="login-brand">
      <img class="logo-mark" src="{% static 'images/giki.png' %}" alt="GIKI logo">
      <span>GIKI Applicant Portal</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your credentials to continue your application.</p>

    {% if form.errors %}
    <div class="login-error">Your username or password was incorrect. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <form method="post" action="{% provider_login_url 'google' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-google">Continue with Google</button>
    </form>
    <p class="auth-switch">New applicant? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</body>

</html>
